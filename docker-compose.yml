#Dockerfile로 만든 여러 이미지를 어떻게 실행할지, 이미지를 서로 어떻게 연결할지 정함

services:
  web:                                    #내가 만든 프로젝트의 이름. 현재는 하나만 있고 web에서 작동하는 grading-app이라 web이라 함
    build: .                              #현재 폴더에 있는 Dockerfile을 사용해 빌드함. 또는 위치를 지정할 수 있음 예: build: ./frontend    # ./frontend 폴더에 있는 Dockerfile을 사용해라!
    container_name: grading-container
    ports:
      - "8080:5000"                       #내컴퓨터 : 도커 컨테이너, localhost:8080으로 브라우저로 접속
                                          #Docker 컨테이너는 네트워크 네임스페이스(Network Namespace) 기술을 통해 호스트 및 다른 컨테이너와 완전히 격리된 독립적인 네트워크 스택을 가집니다.
                                          # 이로 인해 컨테이너 내부에서 특정 포트를 열더(Dockerfile의 EXPO 5000)라도 외부에서는 접근이 불가능합니다.
                                          # docker-compose.yml의 ports: 설정(예: 8080:5000)이러한 격리된 네임스페이스 간에 통신 경로를 생성하는 포트 포워딩을 수행함.
    volumes:                              #컨테이너는 일회성임 즉, 거지면 삭제가 됨
      - ./app:/app                        #[바인드마운트] 내 프로젝트 밖(주소):안(컨테이너)가 즉, 내 컴퓨터 폴더와 컨테이너 폴더를 실시간으로 연결(동기화)이 되기에 빈번하게 변경되는 개발 파일들에 사용 
      - db_data:/data                     #[명명볼륨] 도커가 만든 저장소(이름):안(컨테이너)가 연결이 된다. Dockerfile에서 copy한 내 프로젝트의 data가 /data에 있는데 이후에 생성된 자료는 /data를 통해서 도커가 만든 db_data로 저장이 되어 영속성을 가짐   
    user: "${UID}:${GID}"                 #도커는 컨테이너는 root권한으로 시행되는 그럼 컨테이너 상에 만들어지는 것들 중 바인드마운트가 된 것은 권한의 문제로 유저가 수정 삭제 등의 문제가 생길 수 있음.
                                          # 그래서 user에 ${UID}와 ${GID}를 추가한다. 개인:그룹 을 뜻하는데 나 즉. 현재 사용자와 그룹으로 지정하면 된다. 확인 방법은 wsl에서 id입력
                                          # 보통 처음 만든 사용자는 1000임, 그런데 $은 변수란 뜻으로 도커는 ${UID}이면 터미널환경변수 -> .env -> 시스템환경변수 순으로 찾는다.
                                          # docker-compose config 이걸로 변수 등의 바꾼 것을 확인가능
volumes:
  db_data:
